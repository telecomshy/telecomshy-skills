<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root { --fg:#1f2328; --muted:#6a737d; --line:#e1e4e8; --bg:#fff; --soft:#f6f8fa;
          --p0:#d1242f; --p1:#bf8700; --p2:#57606a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif; }
  header, main, footer { max-width: 960px; margin: 0 auto; padding: 0 20px; }
  header { padding-top: 32px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0 0 4px; font-size: 22px; }
  header .meta { margin: 0; color: var(--muted); font-size: 13px; }
  section { margin: 28px 0; }
  section h2 { font-size: 17px; margin: 0 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .verdict { display:inline-block; padding:2px 10px; border-radius: 999px; background: var(--soft);
             border:1px solid var(--line); font-size:13px; }
  .badge { display:inline-block; padding:1px 8px; border-radius: 999px; font-size:12px;
           background: var(--soft); border:1px solid var(--line); margin-right:6px; }
  .prio { font-weight:700; }
  .prio.p0 { color: var(--p0); } .prio.p1 { color: var(--p1); } .prio.p2 { color: var(--p2); }
  .finding { border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin:10px 0; }
  .finding .loc { font-family: ui-monospace,SFMono-Regular,Consolas,monospace; font-size:12.5px; color:var(--muted); }
  .finding dl { margin:8px 0 0; display:grid; grid-template-columns: 72px 1fr; gap:2px 10px; font-size:13.5px; }
  .finding dt { color: var(--muted); } .finding dd { margin:0; }
  .unverified { color: var(--p1); font-size:12px; }
  footer { margin: 40px auto; color: var(--muted); font-size: 12px; }
  code { background: var(--soft); padding:1px 5px; border-radius:4px; font-size: 12.5px; }
  .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
             margin: 28px 0 0; padding: 14px 0; border-top: 1px solid var(--line); }
  .actions button { font: inherit; font-size: 13px; padding: 6px 14px; border: 1px solid var(--line);
                    border-radius: 6px; background: var(--soft); cursor: pointer; }
  .actions button:hover { background: var(--line); }
  .actions #btnSubmit { background: #1f6feb; border-color: #1f6feb; color: #fff; font-weight: 600; }
  .actions #btnSubmit:hover { background: #1858c4; }
  #triageStatus { color: var(--muted); font-size: 12px; }
  .triage { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-top: 8px;
            padding-top: 8px; border-top: 1px dashed var(--line); font-size: 13px; }
  .triage label { cursor: pointer; }
  .triage .note { flex: 1 1 200px; font: inherit; font-size: 13px; padding: 2px 8px;
                  border: 1px solid var(--line); border-radius: 6px; }
</style>
</head>
<body>
<header>
  <h1>{{TITLE}}</h1>
  <p class="meta">{{META}}</p>
</header>
<main>
  <!--BENCHMARK-->
  <!--FINDINGS-->
  <div class="actions" id="actions">{{TRIAGE_ACTIONS}}</div>
</main>
<footer>shy-skill-suite · render_report.py</footer>
<script>/*__EMBEDDED_DATA__*/</script>
<script>
(function () {
  var ENDPOINT = {{TRIAGE_ENDPOINT}};
  var boxes = Array.prototype.slice.call(document.querySelectorAll(".triage"));
  var actions = document.getElementById("actions");
  var submitBtn = document.getElementById("btnSubmit");
  if (!boxes.length) { if (actions && submitBtn) actions.style.display = "none"; return; }
  var KEY = "shy-triage-" + ((DATA && DATA.skill_name) || "") + "-" + ((DATA && DATA.iteration) || "");
  var status = document.getElementById("triageStatus");
  function load() { try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { return {}; } }
  function state() {
    var out = {};
    boxes.forEach(function (box) {
      var checked = box.querySelector("input[type=radio]:checked");
      if (!checked) return;
      var note = box.querySelector(".note");
      out[box.getAttribute("data-fid")] = {
        choice: checked.value,
        note: note ? note.value : "",
        location: box.getAttribute("data-location") || ""
      };
    });
    return out;
  }
  function update() {
    if (status) status.textContent = "已确认 " + Object.keys(state()).length + " / " + boxes.length +
      "（默认：立即修）";
  }
  function persist() { try { localStorage.setItem(KEY, JSON.stringify(state())); } catch (e) {} update(); }
  var saved = load();
  boxes.forEach(function (box) {
    var rec = saved[box.getAttribute("data-fid")] || {};
    Array.prototype.forEach.call(box.querySelectorAll("input[type=radio]"), function (r) {
      if (r.value === rec.choice) r.checked = true;
      r.addEventListener("change", persist);
    });
    var note = box.querySelector(".note");
    if (note) { note.value = rec.note || ""; note.addEventListener("input", persist); }
  });
  update();
  function payload() {
    var s = state();
    var ids = Object.keys(s).sort(function (a, b) {
      return parseInt(a.slice(1), 10) - parseInt(b.slice(1), 10);
    });
    return {
      skill: (DATA && DATA.skill_name) || "",
      iteration: (DATA && DATA.iteration) || 0,
      generated_at: new Date().toISOString(),
      triage: ids.map(function (id) {
        return { id: id, choice: s[id].choice, note: s[id].note || "", location: s[id].location || "" };
      })
    };
  }
  if (submitBtn && ENDPOINT && location.protocol !== "file:") {
    submitBtn.addEventListener("click", function () {
      submitBtn.disabled = true;
      fetch(ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload())
      }).then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        if (status) status.textContent = "已提交给 agent，请回到对话界面";
      }).catch(function (e) {
        submitBtn.disabled = false;
        if (status) status.textContent = "提交失败：" + e.message;
      });
    });
  }
})();
</script>
</body>
</html>
